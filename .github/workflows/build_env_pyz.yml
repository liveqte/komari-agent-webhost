# .github/workflows/build_env_pyz.yml
name: Build PyAgent with env 

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'py/agent.py'
      - 'setup.py'
      - 'py/requirements.txt'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'py/agent.py'
      - 'setup.py'
      - 'py/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pyagent.pyz (Python 3.8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install shiv build setuptools wheel

      - name: Verify Python version
        run: |
          python --version
          which python
          pip --version

      - name: Install project dependencies
        run: |
          pip install -e .

      # 🔥 使用 sed 注入（2行简洁版，无输出）
      - name: Inject secrets into py/agent.py
        env:
          KOMARI_HTTP_SERVER: ${{ secrets.KOMARI_HTTP_SERVER }}
          KOMARI_TOKEN: ${{ secrets.KOMARI_TOKEN }}
        run: |
          sed -i "s/os\.getenv(['\"]KOMARI_HTTP_SERVER['\"],\s*['\"]['\"])/os.getenv('KOMARI_HTTP_SERVER', '${KOMARI_HTTP_SERVER}')/g" py/agent.py
          sed -i "s/os\.getenv(['\"]KOMARI_TOKEN['\"],\s*['\"]['\"])/os.getenv('KOMARI_TOKEN', '${KOMARI_TOKEN}')/g" py/agent.py

      - name: Build pyagent.pyz with shiv
        run: |
          rm -rf build/ dist/ *.egg-info pyagent.pyz
          
          shiv -c pyagent \
               -o pyagent.pyz \
               . \
               --python "/usr/bin/env python3" \
               --reproducible
          
          ls -lh pyagent.pyz
          file pyagent.pyz

      - name: Test pyz execution
        run: |
          SHIV_FORCE_EXTRACT=1 python pyagent.pyz --help || true
          SIZE=$(stat -c%s pyagent.pyz)
          if [ $SIZE -lt 1000000 ]; then
            echo "⚠️  Warning: pyz file seems too small ($SIZE bytes)"
          fi

      - name: Upload pyagent.pyz as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyagent-pyz
          path: pyagent.pyz
          retention-days: 1
          if-no-files-found: error